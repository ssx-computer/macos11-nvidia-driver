name: build-macos11

# macOS 11 (Big Sur) target. GitHub has no macOS 11 runner, so we build on macos-15-intel (a
# native x86_64 pool that queues far shorter than macos-13) and force the deployment target to
# 11.0. Every CPU-bound build is pinned to the x86-64 baseline because the target machine is an
# Intel E5-1660 v1 (Sandy Bridge-EP): it has AVX but no AVX2, and an AVX2 instruction reaching
# WindowServer is an instant SIGILL and a black screen.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

env:
  MINOS: "11.0"
  MESA_BASE: "17ca6174dcc6cb22059ac343bc29f8af7800f42e"   # tag mesa-26.3.0-rc3 (full sha: GitLab rejects short-sha fetches)
  # macOS 11 has no /Library/GPUBundles: the driver is loaded by its kext, not by the Metal plugin
  # scanner, so the bundles and caches live under /Library/NullMoth on that release.
  NVMTL_BUNDLE_DIR: "/Library/NullMoth"
  RUST_BASELINE: "-C target-cpu=x86-64"

jobs:
  # ---------------------------------------------------------------------------------------------
  # Probe: a cheap, fast sanity check of the macos-15-intel image (macos-13, the older Intel pool,
  # queues for a very long time). It confirms the SDK ships Kernel.framework (kexts), that clang
  # accepts -fapple-kext/-mkernel, and that -target x86_64-apple-macos11.0 produces x86_64
  # objects stamped for minos 11.0.
  # ---------------------------------------------------------------------------------------------
  probe:
    name: probe (macos-15-intel -> x86_64 Big Sur)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Host and SDK
        run: |
          set -u
          uname -m
          sw_vers
          xcodebuild -version
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          echo "SDK=$SDK"
          echo "sdk version: $(xcrun --sdk macosx --show-sdk-version)"
          echo "-- Kernel.framework present? --"
          ls -d "$SDK/System/Library/Frameworks/Kernel.framework/Headers" 2>&1 || echo "MISSING Kernel.framework"
          echo "-- IOKit present? --"
          ls -d "$SDK/System/Library/Frameworks/IOKit.framework" 2>&1 || echo "MISSING IOKit"
          echo "-- Metal present? --"
          ls -d "$SDK/System/Library/Frameworks/Metal.framework" 2>&1 || echo "MISSING Metal"

      - name: Can clang emit x86_64 objects for macOS 11?
        run: |
          set -u
          printf 'int f(void){return 42;}\n' > /tmp/probe.c
          xcrun clang -target x86_64-apple-macos11.0 -c /tmp/probe.c -o /tmp/probe.o && echo "COMPILE OK" || echo "COMPILE FAILED"
          if [ -f /tmp/probe.o ]; then
            xcrun vtool -show-build /tmp/probe.o || true
            xcrun lipo -info /tmp/probe.o || true
            xcrun file /tmp/probe.o || true
          fi

      - name: Can clang build a kext (fapple-kext + Kernel.framework) for x86_64?
        run: |
          set -u
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          printf 'extern "C" int probe_kmod(void){return 7;}\n' > /tmp/probe_kmod.cpp
          xcrun clang++ -target x86_64-apple-macos11.0 -mmacosx-version-min=11.0 \
            -fapple-kext -mkernel -nostdinc -isysroot "$SDK" \
            -I"$SDK/System/Library/Frameworks/Kernel.framework/Headers" \
            -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT \
            -std=c++17 -fno-rtti -fno-exceptions -fno-builtin -fno-common \
            -c /tmp/probe_kmod.cpp -o /tmp/probe_kmod.o && echo "KEXT COMPILE OK" || echo "KEXT COMPILE FAILED"
          [ -f /tmp/probe_kmod.o ] && xcrun file /tmp/probe_kmod.o || true

      - name: Is the host x86_64 and is a Rust toolchain available?
        run: |
          set -u
          uname -m
          sysctl -n sysctl.proc_translated 2>/dev/null || echo "no proc_translated key"
          which rustc || echo "no rustc preinstalled"
          which cargo || echo "no cargo preinstalled"
          arch || true

      - name: Does the SDK still link a Metal bundle for x86_64?
        run: |
          set -u
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          printf '#import <Metal/Metal.h>\nint probe(void){id<MTLDevice> d = MTLCreateSystemDefaultDevice(); return d ? 1 : 0;}\n' > /tmp/probe_metal.m
          xcrun clang -target x86_64-apple-macos11.0 -mmacosx-version-min=11.0 -fobjc-arc \
            -isysroot "$SDK" -c /tmp/probe_metal.m -o /tmp/probe_metal.o && echo "METAL COMPILE OK" || echo "METAL COMPILE FAILED"
          [ -f /tmp/probe_metal.o ] && xcrun file /tmp/probe_metal.o || true

  userland:
    name: userland (plugin + translator + NVK)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx --show-sdk-path

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Meson and Ninja
        run: |
          # Homebrew's python3 is PEP-668 externally managed on macOS 14+, so --user fails.
          # Use a venv and put its bin/ on GITHUB_PATH for the build steps.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade meson ninja
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH only takes effect from the NEXT step, so verify with the full path here.
          "$RUNNER_TEMP/venv/bin/meson" --version
          "$RUNNER_TEMP/venv/bin/ninja" --version

      - name: Build translator (AIR to SPIR-V)
        run: |
          set -euo pipefail
          export RUSTFLAGS="$RUST_BASELINE --remap-path-prefix=$PWD/translator=/src"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          cargo build --release \
            --manifest-path translator/wrapper/Cargo.toml \
            --target-dir "$RUNNER_TEMP/xlate-target"
          D="$RUNNER_TEMP/xlate-target/release/libnvmtl_translate.dylib"
          cp "$D" "$OUT/libnvmtl_translate.dylib"
          install_name_tool -id @rpath/libnvmtl_translate.dylib "$OUT/libnvmtl_translate.dylib"
          codesign -f -s - "$OUT/libnvmtl_translate.dylib"
          file "$OUT/libnvmtl_translate.dylib"

      - name: Build Metal plugin (NVMTLDriver)
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/Vulkan-Headers"
          OUT="$RUNNER_TEMP/out/plugin"
          mkdir -p "$OUT"
          cd plugin
          # NVMTL_BUNDLE_DIR is a C string literal: clang needs the inner quotes, so they are
          # built into the argument here rather than relying on shell quoting to survive.
          BUNDLEDIR="-DNVMTL_BUNDLE_DIR=\"$NVMTL_BUNDLE_DIR\""
          xcrun clang -arch x86_64 -march=x86-64 -bundle -fobjc-arc -O1 \
            -mmacosx-version-min="$MINOS" -Wunguarded-availability-new \
            "$BUNDLEDIR" \
            -I"$RUNNER_TEMP/Vulkan-Headers/include" \
            -o "$OUT/NVMTLDriver" NVMTLDevice.m \
            -framework Foundation -framework Metal -framework IOSurface \
            -framework IOKit -framework CoreFoundation \
            2> "$OUT/NVMTLDriver.err" \
            || { grep -A2 ': error:' "$OUT/NVMTLDriver.err" | head -40; exit 1; }
          codesign -f -s - "$OUT/NVMTLDriver"
          otool -l "$OUT/NVMTLDriver" | awk '/minos/{print "minos", $2; exit}'
          echo "errors: $(grep -c ': error:' "$OUT/NVMTLDriver.err" || true)"

      - name: Build NVK (libvulkan_nouveau.dylib) from Mesa
        run: |
          set -euo pipefail
          # nvk-macos.patch carries git-style headers (`--- a/<rel>` / `+++ b/<rel>`) and is a
          # pure modification of the pristine MESA_BASE tree (no new files, no /dev/null). So we
          # fetch exactly MESA_BASE and `git apply` from INSIDE the mesa checkout: git strips the
          # a/ and b/ prefixes and patches <rel>, and every hunk's context matches the baseline.
          MESA="$GITHUB_WORKSPACE/rebase263/mesa"
          rm -rf "$MESA"
          mkdir -p "$MESA"
          cd "$MESA"
          git init -q .
          git remote add origin https://gitlab.freedesktop.org/mesa/mesa.git
          git fetch -q --depth 1 origin "$MESA_BASE"
          git checkout -q FETCH_HEAD
          git apply --stat "$GITHUB_WORKSPACE/nvk/nvk-macos.patch" | tail -3
          git apply "$GITHUB_WORKSPACE/nvk/nvk-macos.patch"
          echo "patched files: $(git status --short | wc -l | tr -d ' ')"
          meson setup build . -Dbuildtype=release -Db_ndebug=true \
            -Dvulkan-drivers=nouveau -Dgallium-drivers= -Dplatforms= \
            -Degl=disabled -Dglx=disabled -Dglvnd=disabled -Dllvm=disabled \
            -Dvulkan-layers= -Dtools= -Dbuild-tests=false -Dexpat=disabled \
            -Dzstd=disabled -Dlibunwind=disabled -Dlmsensors=disabled \
            -Dvalgrind=disabled -Dxlib-lease=disabled -Dgallium-rusticl=false \
            -Dspirv-tools=disabled \
            -Dc_args="-march=x86-64 -ffile-prefix-map=$PWD=/src" \
            -Dcpp_args="-march=x86-64 -ffile-prefix-map=$PWD=/src" \
            -Drust_args="-C target-cpu=x86-64 --remap-path-prefix=$PWD=/src"
          ninja -C build -k 0 src/nouveau/vulkan/libvulkan_nouveau.dylib
          OUT="$RUNNER_TEMP/out/nvmtl"
          mkdir -p "$OUT"
          cp build/src/nouveau/vulkan/libvulkan_nouveau.dylib "$OUT/"
          strip -S "$OUT/libvulkan_nouveau.dylib"
          file "$OUT/libvulkan_nouveau.dylib"

      - name: Assemble GPUBundles layout
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          B="$OUT/GPUBundles/NVMTLDriver.bundle"
          mkdir -p "$B/Contents/MacOS" "$OUT/GPUBundles/nvmtl"
          cp "$OUT/plugin/NVMTLDriver" "$B/Contents/MacOS/NVMTLDriver"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string NVMTLDriver' \
            -c 'Add :CFBundleIdentifier string com.nullmoth.NVMTLDriver' \
            -c 'Add :CFBundleName string NVMTLDriver' \
            -c 'Add :CFBundlePackageType string BNDL' \
            -c 'Add :CFBundleVersion string 2.0.5' "$B/Contents/Info.plist"
          cp "$OUT/nvmtl/libvulkan_nouveau.dylib" "$OUT/GPUBundles/nvmtl/"
          cp "$OUT/libnvmtl_translate.dylib" "$OUT/GPUBundles/nvmtl/"
          printf '%s\n' '*NVAccel*' > "$OUT/GPUBundles/nvmtl-allow.txt"
          find "$OUT/GPUBundles" -type f | sort

      - name: Upload userland
        uses: actions/upload-artifact@v4
        with:
          name: userland
          path: ${{ runner.temp }}/out/GPUBundles/
          if-no-files-found: error

  kexts:
    name: kexts (NMDRM + NMHDA)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Xcode SDK path
        run: |
          SDKPATH=$(xcrun --sdk macosx --show-sdk-path)
          echo "SDK=$SDKPATH" >> "$GITHUB_ENV"
          echo "$SDKPATH"

      - name: Build NMDRM
        run: |
          set -euo pipefail
          bash kexts/NMDRM/build.sh "$RUNNER_TEMP/out"

      - name: Build NMHDA
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/acidanthera/MacKernelSDK.git "$RUNNER_TEMP/MacKernelSDK"
          curl -fsSL -o "$RUNNER_TEMP/lilu.zip" \
            https://github.com/acidanthera/Lilu/releases/latest/download/Lilu-1.7.2-DEBUG.zip
          ( cd "$RUNNER_TEMP" && unzip -q lilu.zip )
          LILU=$(find "$RUNNER_TEMP" -maxdepth 2 -name 'Lilu.kext' -type d | head -1)
          bash kexts/NMHDA/build.sh "$LILU" "$RUNNER_TEMP/MacKernelSDK" "$RUNNER_TEMP/out"

      - name: Upload kexts
        uses: actions/upload-artifact@v4
        with:
          name: kexts
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
